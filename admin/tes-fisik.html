<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Tes Fisik & Seragam — Admin SPMB</title>
    <meta name="theme-color" content="#FAF7F2" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="bg-cream text-ink-900 antialiased">
    <header id="adminHeader" class="sticky top-0 z-40 bg-cream/95 backdrop-blur-sm"></header>
    <main id="app" class="mx-auto max-w-6xl px-4 pb-16 pt-4 sm:px-6"><p class="text-[15px] text-ink-600">Memuat…</p></main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/app-config.js"></script>
    <script src="../assets/js/sheetson.js"></script>
    <script src="../assets/js/admin-auth.js"></script>
    <script src="../assets/js/admin-ui.js"></script>
    <script>
      (async () => {
        const profile = await AdminAuth.requireRole(["tes_fisik"]);
        AdminUI.renderShell(profile, "tes-fisik");
        const esc = Sheetson.escapeHtml;
        const num = (v, unit) => (Number(v) > 0 ? `${esc(v)} ${unit}` : "-");
        const today = () => new Date().toLocaleDateString("id-ID", { day: "2-digit", month: "2-digit", year: "numeric" }).replace(/\//g, "-");

        AdminUI.modulePage({
          sheet: "Tes_Fisik_Seragam",
          title: "Tes Fisik & Seragam",
          intro: "Isi hasil pengukuran, tes fisik, dan ukuran seragam.",
          filter: { field: "statusTesFisik", label: "Status tes", options: ["Belum Tes", "Lulus Tes", "Tidak Lulus"] },
          columns: [
            { label: "Siswa", render: (r) => `<b>${esc(r.namaLengkap || "-")}</b><br><span class="text-[13px] text-ink-500">${esc(r.noPendaftaran || "")}</span>` },
            { label: "Tinggi / Berat", render: (r) => `${num(r.tinggiBadan, "cm")} / ${num(r.beratBadan, "kg")}` },
            { label: "Tato/Tindik", render: (r) => esc(r.tatoTindik || "-") },
            { label: "Status tes", render: (r) => AdminUI.badge(r.statusTesFisik || "Belum Tes") },
            { label: "Seragam", render: (r) => `<b>${esc(r.ukuranSeragam || "-")}</b>` + (r.tglUkurSeragam && r.tglUkurSeragam !== "-" ? `<br><span class="text-[13px] text-ink-500">${esc(r.tglUkurSeragam)}</span>` : "") },
            { label: "Catatan", render: (r) => esc(r.catatanTesFisik && r.catatanTesFisik !== "-" ? r.catatanTesFisik : "") },
          ],
          editTitle: (r) => `Tes fisik: ${r.namaLengkap || r.noPendaftaran}`,
          fields: [
            { name: "tinggiBadan", label: "Tinggi badan (cm)", type: "number" },
            { name: "beratBadan", label: "Berat badan (kg)", type: "number" },
            { name: "tatoTindik", label: "Tato / tindik", type: "select", options: ["-", "Tidak Ada", "Ada"] },
            { name: "statusTesFisik", label: "Hasil tes fisik", type: "select", options: ["Belum Tes", "Lulus Tes", "Tidak Lulus"] },
            { name: "ukuranSeragam", label: "Ukuran seragam", type: "select", options: ["-", "S", "M", "L", "XL", "XXL"], help: "Tanggal ukur terisi otomatis saat ukuran diubah." },
            { name: "catatanTesFisik", label: "Catatan", type: "textarea" },
          ],
          beforeSave: (changes) => {
            if (changes.ukuranSeragam && changes.ukuranSeragam !== "-") changes.tglUkurSeragam = today();
            return changes;
          },
        });
      })();
    </script>
  </body>
</html>
