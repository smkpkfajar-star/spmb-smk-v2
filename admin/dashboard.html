<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dashboard — Admin SPMB</title>
    <meta name="theme-color" content="#FAF7F2" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="bg-cream text-ink-900 antialiased">
    <header id="adminHeader" class="sticky top-0 z-40 bg-cream/95 backdrop-blur-sm"></header>
    <main id="app" class="mx-auto max-w-6xl px-4 pb-16 pt-4 sm:px-6">
      <p class="text-[15px] text-ink-600">Memuat…</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/app-config.js"></script>
    <script src="../assets/js/sheetson.js"></script>
    <script src="../assets/js/admin-auth.js"></script>
    <script src="../assets/js/admin-ui.js"></script>
    <script>
      (async () => {
        const profile = await AdminAuth.requireRole([]);
        AdminUI.renderShell(profile, "");
        const esc = Sheetson.escapeHtml;
        const ditolak = new URLSearchParams(location.search).get("ditolak");
        const cards = AdminAuth.modulesFor(profile.role)
          .map(
            (m) => `<a href="${m.href}" class="group flex gap-4 rounded-3xl border-2 border-transparent bg-white p-5 hover:border-brand-600">
              <span class="text-4xl" aria-hidden="true">${m.icon}</span>
              <span><span class="block text-lg font-extrabold group-hover:text-brand-700">${esc(m.title)}</span>
              <span class="mt-1 block text-[15px] text-ink-600">${esc(m.desc)}</span></span></a>`
          )
          .join("");
        document.getElementById("app").innerHTML = `
          ${ditolak ? `<p class="mb-4 rounded-2xl bg-amber-100 p-4 text-[15px] font-semibold text-amber-900" role="alert">Anda tidak punya akses ke halaman itu. Pilih modul sesuai tugas Anda.</p>` : ""}
          <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">Halo, ${esc(profile.nama_lengkap || "Petugas")} 👋</h1>
          <p class="mt-1 text-[15px] text-ink-600">Pilih modul tugas Anda.</p>
          <div class="mt-6 grid gap-3 sm:grid-cols-2">${cards}</div>
          <p class="mt-8 rounded-2xl bg-white p-4 text-[14px] text-ink-600">
            💡 Data yang diubah di sini langsung tersimpan di Google Sheets panitia.
            Spreadsheet tetap bisa dibuka seperti biasa.
          </p>`;
      })();
    </script>
  </body>
</html>
