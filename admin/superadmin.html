<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Superadmin - Control Panel SPMB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: { brand: { 50: "#eef2ff", 100: "#e0e7ff", 500: "#6366f1", 600: "#4f46e5", 700: "#4338ca" } }
          }
        }
      };
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="dashboard.html" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
            <i class="fa-solid fa-arrow-left"></i>
          </a>
          <span class="font-bold text-lg text-slate-900">Superadmin Control Panel</span>
        </div>
        <button onclick="logoutAdmin()" class="text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 px-3 py-2 rounded-xl">Keluar</button>
      </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <h2 class="font-bold text-slate-900 text-lg flex items-center gap-2">
          <i class="fa-solid fa-chart-pie text-brand-600"></i> Rekapitulasi Sistem
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
            <span class="block text-xs text-slate-500 font-medium">Total Akun Admin</span>
            <span class="text-2xl font-extrabold text-brand-600">4 Petugas</span>
          </div>
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
            <span class="block text-xs text-slate-500 font-medium">Status Integrasi</span>
            <span class="text-2xl font-extrabold text-emerald-600">Aktif (Sheetson & Supabase)</span>
          </div>
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
            <span class="block text-xs text-slate-500 font-medium">Akses Role</span>
            <span class="text-2xl font-extrabold text-indigo-600">Full Access</span>
          </div>
        </div>
      </div>
    </main>

    <script src="../assets/js/auth.js"></script>
    <script>
      checkAdminAccess(["superadmin"]);
    </script>
  </body>
</html>
