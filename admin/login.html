<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - SPMB Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: { 50: "#eef2ff", 100: "#e0e7ff", 500: "#6366f1", 600: "#4f46e5", 700: "#4338ca" }
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-brand-600 text-white flex items-center justify-center text-2xl font-bold mx-auto shadow-md">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900">Portal Admin SPMB</h1>
        <p class="text-xs text-slate-500">Silakan login menggunakan akun petugas yang terdaftar</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Username</label>
          <input type="text" id="username" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="Masukkan username" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="Masukkan password" />
        </div>

        <div id="loginError" class="text-xs text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-200 hidden"></div>

        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk Dashboard
        </button>
      </form>

      <div class="pt-4 border-t text-center text-xs text-slate-400">
        &copy; 2026 Panitia SPMB. Hak cipta dilindungi.
      </div>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script>
      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const res = loginAdmin(user, pass);
        if (res.success) {
          window.location.href = "dashboard.html";
        } else {
          const errEl = document.getElementById("loginError");
          errEl.textContent = res.message;
          errEl.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
