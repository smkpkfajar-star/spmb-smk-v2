<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Pakdhe.dev RPL" />
    <meta name="robots" content="noindex" />
    <title>Login Petugas — SPMB SMK Tamansiswa Jetis</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAF7F2" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/umum/tailwind-config.js"></script>
    <script src="../assets/js/umum/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="bg-cream text-ink-900 antialiased">
    <div class="fixed right-4 top-4 z-10"><button type="button" data-tema data-kiosk-hide class="btn grid h-9 w-9 shrink-0 place-items-center rounded-full text-ink-600 shadow-[inset_0_0_0_1px_rgb(var(--garis-tombol))] hover:bg-sand hover:text-ink-900" aria-label="Ganti ke mode gelap" title="Ganti ke mode gelap"><svg class="ikon-bulan" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="ikon-matahari" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
    <main class="hero-bg flex min-h-screen items-center justify-center px-4 py-10"><span class="cahaya" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div class="w-full max-w-sm">
        <div class="mb-6 flex items-center gap-2.5">
          <img src="../assets/img/logo.webp" alt="" width="36" height="36" class="h-9 w-9 shrink-0 rounded-lg" />
          <span class="leading-tight">
            <span class="block text-base font-semibold">Admin SPMB</span>
            <span class="block text-sm text-ink-500">SMK Tamansiswa Jetis</span>
          </span>
        </div>

        <form id="loginForm" class="rounded-3xl border border-hairline bg-white p-6" novalidate>
          <h1 class="text-2xl font-semibold">Login petugas</h1>
          <p class="mt-1 text-[15px] text-ink-600">Masuk dengan akun yang diberikan superadmin.</p>

          <label for="username" class="mb-1.5 mt-5 block text-[15px] font-semibold">Username</label>
          <input id="username" type="text" autocomplete="username" autocapitalize="none" class="w-full rounded-xl border-2 border-line px-3.5 py-3 text-base focus:border-brand-600 focus:outline-none" placeholder="Contoh: bendahara" />

          <label for="password" class="mb-1.5 mt-4 block text-[15px] font-semibold">Password</label>
          <span class="relative block">
            <input id="password" type="password" autocomplete="current-password" class="w-full rounded-xl border-2 border-line py-3 pl-3.5 pr-28 text-base focus:border-brand-600 focus:outline-none" />
            <button type="button" id="togglePw" class="absolute inset-y-0 right-1.5 my-1.5 rounded-lg px-3 text-[14px] font-semibold text-brand-700 hover:bg-brand-50" aria-pressed="false">Lihat</button>
          </span>

          <p id="loginInfo" class="mt-4 hidden rounded-2xl bg-sand p-3 text-[15px] font-medium text-ink-900" role="status"></p>
          <p id="loginError" class="mt-4 hidden rounded-2xl bg-red-50 p-3 text-[15px] font-semibold text-red-700" role="alert"></p>

          <button id="loginBtn" type="submit" class="mt-5 w-full rounded-full bg-brand-600 px-6 py-4 text-base font-bold text-white hover:bg-brand-700 disabled:opacity-60">Masuk</button>
        </form>
        <p class="mt-4 text-center text-sm text-ink-500">Lupa password? Hubungi superadmin.</p>
        <p class="mt-6 text-center"><a href="https://rpl.tamsis.site/" target="_blank" rel="noopener" class="font-mono text-[12.5px] text-ink-500 hover:text-ink-900">crafted by Pakdhe.dev RPL ↗</a></p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/umum/app-config.js"></script>
    <script src="../assets/js/admin/auth.js"></script>
    <script>
      (async () => {
        if (new URLSearchParams(location.search).get("sesi") === "habis") {
          const info = document.getElementById("loginInfo");
          info.textContent = "Anda keluar otomatis karena tidak ada aktivitas selama 20 menit. Silakan masuk lagi.";
          info.classList.remove("hidden");
          history.replaceState(null, "", location.pathname);
        }
        // Sudah login sebagai petugas? langsung ke dashboard
        const existing = await AdminAuth.getProfile().catch(() => null);
        if (existing && AdminAuth.isStaffRole(existing.role)) return location.replace("dashboard.html");

        const form = document.getElementById("loginForm");
        const err = document.getElementById("loginError");
        const btn = document.getElementById("loginBtn");
        const pw = document.getElementById("password");
        document.getElementById("togglePw").addEventListener("click", (e) => {
          const show = pw.type === "password";
          pw.type = show ? "text" : "password";
          e.target.textContent = show ? "Sembunyikan" : "Lihat";
          e.target.setAttribute("aria-pressed", String(show));
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value;
          err.classList.add("hidden");
          if (!username.trim() || !pw.value) {
            err.textContent = "Isi username dan password.";
            err.classList.remove("hidden");
            return;
          }
          btn.disabled = true;
          btn.textContent = "Memeriksa…";
          const res = await AdminAuth.login(username, pw.value);
          if (res.ok) return location.replace("dashboard.html");
          err.textContent = res.error;
          err.classList.remove("hidden");
          btn.disabled = false;
          btn.textContent = "Masuk";
        });
      })();
    </script>
  </body>
</html>
